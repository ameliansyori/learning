Di kotak gede bawahnya, copas ulang kode sakti versi 2026 kita:
   ```yaml
   name: Machine Learning CI Pipeline

   on:
     push:
       branches: [ main, master ]
     pull_request:
       branches: [ main, master ]

   jobs:
     build-and-test:
       runs-on: ubuntu-latest

       steps:
       - name: Checkout Code
         uses: actions/checkout@v4

       - name: Set up Python 3.10
         uses: actions/setup-python@v5
         with:
           python-version: '3.10'

       - name: Verify Environment
         run: |
           python --version
           pip --version
           echo "CI Pipeline runs successfully with updated 2026 actions!"
